spring:
  application:
    name: folder-sync-service

  datasource:
    url: jdbc:h2:file:${H2_DB_PATH:./data/scanner};AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: foldersync
    password: foldersync

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.documentshub.foldersync: INFO

server:
  port: ${SERVER_PORT:8081}